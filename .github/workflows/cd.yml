name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Keep this disabled until the AWS account, variables and role are ready.
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.EKS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'logpulse' }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Roll out image
        run: |
          kubectl -n logpulse set image deployment/logpulse-app logpulse=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          kubectl -n logpulse rollout status deployment/logpulse-app --timeout=180s

      - name: Cluster smoke test
        run: |
          kubectl -n logpulse run logpulse-smoke-${{ github.run_id }} \
            --rm --restart=Never --image=curlimages/curl:8.10.1 \
            --command -- curl --fail --silent http://logpulse/ping
