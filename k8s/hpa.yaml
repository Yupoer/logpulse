# =========================================================
# HPA (Horizontal Pod Autoscaler)
# 讀 metrics-server 提供的 CPU，依下方設定的 target 調整副本數。
# 設定允許 logpulse-app 在 2 到 6 個副本間調整；此檔案本身不代表已達到上限。
# =========================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logpulse-hpa
  namespace: logpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logpulse-app
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
