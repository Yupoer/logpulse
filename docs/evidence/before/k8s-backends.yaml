# =========================================================
# 有狀態後端:MySQL / Redis / Zookeeper / Kafka / Elasticsearch
#
# 重點(面試講法):
# 這些是「有狀態」服務。我刻意用單副本 Deployment + emptyDir,
# 因為這是 demo,資料不需要持久化。生產環境才會用 StatefulSet + PVC,
# 或乾脆交給 managed service。這就是「有狀態 vs 無狀態」的邊界判斷。
#
# 每個後端的 Service 名稱 (mysql/redis/kafka/elasticsearch) 跟原本
# docker-compose 完全一樣 → app 的設定一個字都不用改。
# =========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: ["--default-authentication-plugin=mysql_native_password"]
          env:
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: logpulse-secret, key: MYSQL_ROOT_PASSWORD } } }
            - { name: MYSQL_DATABASE,      valueFrom: { secretKeyRef: { name: logpulse-secret, key: MYSQL_DATABASE } } }
            - { name: MYSQL_USER,          valueFrom: { secretKeyRef: { name: logpulse-secret, key: MYSQL_USER } } }
            - { name: MYSQL_PASSWORD,      valueFrom: { secretKeyRef: { name: logpulse-secret, key: MYSQL_PASSWORD } } }
          ports: [{ containerPort: 3306 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: mysql }
spec:
  selector: { app: mysql }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
spec:
  replicas: 1
  selector: { matchLabels: { app: zookeeper } }
  template:
    metadata: { labels: { app: zookeeper } }
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.4.0
          env:
            - { name: ZOOKEEPER_CLIENT_PORT, value: "2181" }
            - { name: ZOOKEEPER_TICK_TIME,   value: "2000" }
          ports: [{ containerPort: 2181 }]
---
apiVersion: v1
kind: Service
metadata: { name: zookeeper }
spec:
  selector: { app: zookeeper }
  ports: [{ port: 2181, targetPort: 2181 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.4.0
          env:
            - { name: KAFKA_BROKER_ID, value: "1" }
            - { name: KAFKA_ZOOKEEPER_CONNECT, value: "zookeeper:2181" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
          ports:
            - { containerPort: 29092 }
            - { containerPort: 9092 }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec:
  selector: { app: kafka }
  ports:
    - { name: internal, port: 29092, targetPort: 29092 }
    - { name: host,     port: 9092,  targetPort: 9092 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
spec:
  replicas: 1
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata: { labels: { app: elasticsearch } }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
          env:
            - { name: discovery.type, value: "single-node" }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          ports: [{ containerPort: 9200 }]
---
apiVersion: v1
kind: Service
metadata: { name: elasticsearch }
spec:
  selector: { app: elasticsearch }
  ports: [{ port: 9200, targetPort: 9200 }]
